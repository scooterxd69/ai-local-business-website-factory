name: CI

on:
  push:
    branches: [main, pc-lab, laptop-lab]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run render:all
      - name: Upload rendered sites
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sites
          path: dist/
          retention-days: 7
